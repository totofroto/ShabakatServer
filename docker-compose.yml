services:
  shabakat:
    build: .
    network_mode: "host"
    # ports:
    #   - "7779:7779"
    image: shabakat-server:latest
    container_name: shabakat-server
    restart: unless-stopped

    # CRITICAL: host networking gives the scanner raw LAN access —
    # SSDP multicast, mDNS, /proc/net/arp, and real ICMP all require it.

    # NET_RAW: allows real ICMP ping (not just TCP probe)
    cap_add:
      - NET_ADMIN
      - NET_RAW

    env_file:
      - .env

    volumes:
      # Named Docker volume for SQLite persistence.
      # This bypasses Asustor BTRFS host-bind-mount restrictions that break
      # SQLite WAL shared-memory mapping and cause "disk image is malformed".
      - shabakat_data:/data

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  shabakat_data:
    driver: local
